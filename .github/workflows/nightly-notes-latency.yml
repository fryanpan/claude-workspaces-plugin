name: Nightly notes latency

# THE THRESHOLD ON THE NUMBER BRYAN FEELS: how long a finished sentence waits
# before its note is in the doc. The target is a median under ten seconds
# ("Bryan can see the note for what he just said within 10s"), so the check
# fails over ten seconds rather than reporting a number nobody reads.
#
# NIGHTLY, NOT PER PUSH, and for one reason: it is a MEASUREMENT. It costs
# nothing (a virtual clock and the deterministic composer — no network, no
# browser), but a latency figure that can turn somebody else's PR red invites
# tuning the threshold instead of the pipeline. A nightly failure opens an
# issue, which is a conversation.
#
# THE CORPUS IS SYNTHETIC. The real-meeting replay
# (`--replay <transcript.jsonl>`) runs on Bryan's machine against his own data
# dir and never in CI: those are private meetings, and redacting the words
# before the pipeline sees them makes the replay safe to RUN, not the
# transcript safe to copy.
on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-notes-latency
  cancel-in-progress: false

jobs:
  latency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Same pin as ci.yml. Bump the three together.
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Measure
        id: measure
        run: bun run notes:latency | tee latency.txt
      - name: Report a regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'The nightly notes-latency check is over its threshold.',
              '',
              'A finished sentence is waiting longer than ten seconds for its',
              'note. Run `bun run notes:latency` locally, and',
              '`bun run scripts/notes-latency-check.ts --replay <transcript.jsonl>`',
              'against a real meeting to see which clock the wait is in.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const title = 'Nightly: notes latency over threshold';
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'nightly',
            });
            const existing = open.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['nightly'],
                assignees: [context.repo.owner],
              });
            }
