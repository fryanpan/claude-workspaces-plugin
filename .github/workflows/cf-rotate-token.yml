# A new secret for one existing Access service token
# (infra/cloudflare/rotate-token.ts). This is the job the keeper's
# `service-token-rotate` hold became (docs/process/keeper.md, "Retired").
#
#   dispatch   on main only, with the token's name. `bun run cf:rotate-token
#              "<name>"` on the Mac dispatches it with Bryan's `gh` login.
#
# It runs in `cloudflare-prod`, whose apply token already holds Access
# Service Tokens Edit, and has no reviewer: a merged pull request is the
# approval. The token keeps its id, so Terraform sees no change; the old
# secret works for 24 hours more. The new pair is sealed to the Mac's
# committed key (infra/handoff/) and uploaded as `handoff-mac`; only the Mac's
# private key opens it, and `bun run handoff:pull` puts it over the old one in
# the Keychain. No secret is printed: the name reaches the script through the
# environment, never the shell's text.

name: cf-rotate-token

on:
  workflow_dispatch:
    inputs:
      name:
        description: The service token's name in Cloudflare
        required: true
        type: string

permissions: {}

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    concurrency:
      group: cloudflare-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Rotate and seal the new pair to the Mac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CW_HANDOFF_OUT: ${{ runner.temp }}/handoff-mac/handoff.json
          TOKEN_NAME: ${{ inputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/handoff-mac"
          bun infra/cloudflare/rotate-token.ts --ci "$TOKEN_NAME"
      - name: Hand the Mac the new pair
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoff-mac
          path: ${{ runner.temp }}/handoff-mac/
          if-no-files-found: ignore
          retention-days: 8
