# The sign-in test app (infra/signin-test/README.md): the sign-in template,
# live at its own hostname, with password, magic link and Google sign-in.
#
#   dispatch  on main only. Any other branch deploys nothing.
#
# One step does it all, in order: Resend's sending domain, the Terraform root
# infra/cloudflare/apps/signin-test (D1, Turnstile, the custom domain, the
# mail DNS records), the Worker's secrets, the D1 migrations, the Worker, and
# the smoke test against the live app (infra/signin-test/deploy.ts).
#
# Secrets, in the `cloudflare-prod` environment (deployments from main only),
# all written by `bun run cf:ci-secrets apply`:
#   CLOUDFLARE_API_TOKEN, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   the deploy token and state key
#   RESEND_API_KEY                                                 full access: the domain and the app's send-only key
#   SIGNIN_TEST_GOOGLE_CLIENT_ID, SIGNIN_TEST_GOOGLE_CLIENT_SECRET the app's Google OAuth client
# They are on the deploy step alone: `bun install` and the setup actions never
# see them. The repo and its logs are public: the step prints the plan's
# addresses and verbs, step names and secret names, never a value.

name: signin-test

on:
  workflow_dispatch:
    inputs:
      rotate_mail_key:
        description: Make a new send-only Resend key for the app and delete the old one
        type: boolean
        required: false
        default: false

permissions: {}

env:
  TF_IN_AUTOMATION: '1'

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    concurrency:
      group: signin-test
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Deploy and smoke-test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SIGNIN_TEST_GOOGLE_CLIENT_ID: ${{ secrets.SIGNIN_TEST_GOOGLE_CLIENT_ID }}
          SIGNIN_TEST_GOOGLE_CLIENT_SECRET: ${{ secrets.SIGNIN_TEST_GOOGLE_CLIENT_SECRET }}
          SIGNIN_TEST_ROTATE_MAIL_KEY: ${{ inputs.rotate_mail_key && '1' || '0' }}
          CF_TFSTATE_BUCKET: ${{ vars.CF_TFSTATE_BUCKET }}
        run: bun infra/cloudflare/ci-credentials.ts --account-id -- bun infra/signin-test/deploy.ts
