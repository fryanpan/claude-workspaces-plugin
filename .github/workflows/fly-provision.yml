# Make a project's Fly app, volume, snapshot bucket, backup key and push keys
# (docs/process/project-machine.md, "Provisioning a project"). This is the job
# the keeper's provisioning holds became (docs/process/keeper.md, "Retired").
#
#   dispatch   on main only, naming a project machines.json already lists.
#              The two refreshes pass through to `machine:deploy`
#              (`machines.ts provisionFlags`). The repos the server pushes to
#              are that project's `pushRepos` in machines.json, never an
#              input: GH_ADMIN_TOKEN can put a write key on any repo it
#              reaches, so only a merged change names one.
#
# Two jobs, because no one environment holds both halves:
#
#   outputs    in `cloudflare-prod`, the one holder of the Terraform state key
#              and of a Cloudflare token that reads a tunnel's token. It reads
#              the tunnel token and the Access settings and seals them to
#              `fly-org`'s committed key (provision-outputs.ts). The artifact
#              is public; only fly-org's HANDOFF_PRIVATE_KEY opens it.
#   provision  in `fly-org` (FLY_API_TOKEN, the org token; GH_ADMIN_TOKEN;
#              HANDOFF_PRIVATE_KEY; variable FLY_ORG_SLUG). It runs
#              `machine:deploy`, which makes what is missing and sets the
#              sealed settings, then cuts the narrow tokens again
#              (fly-ci-tokens.yml's apply) so the new app has its own.
#              What it made for the Mac (the backup identity, the bucket's
#              keys, the Mac's app token, and on the first run the transcript
#              store's identities and reader) is sealed to the Mac and uploaded
#              as `handoff-mac`; `bun run handoff:pull` stores it.
#
# Both environments admit deployments from main alone and have no reviewer: a
# merged pull request is the approval (Bryan, 19 Nov 2026). A lead's Claude
# sign-in needs a browser, so a project with a board to lead gets it from the
# Mac's next `machine:deploy`, which needs only the app's own token.

name: fly-provision

on:
  workflow_dispatch:
    inputs:
      project:
        description: A project machines.json lists
        required: true
        type: string
      refresh_push_keys:
        description: Make the push keys again, for the pushRepos machines.json lists
        required: false
        type: boolean
        default: false
      refresh_tunnel_token:
        description: Set the tunnel token again, after Terraform remade the tunnel
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: fly-provision-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  outputs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Seal the tunnel token and the Access settings to fly-org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_TFSTATE_BUCKET: ${{ vars.CF_TFSTATE_BUCKET }}
          CW_PROVISION_HANDOFF_OUT: ${{ runner.temp }}/provision/provision.json
          PROJECT: ${{ inputs.project }}
        run: |
          mkdir -p "$RUNNER_TEMP/provision"
          bun infra/cloudflare/ci-credentials.ts --account-id -- bun infra/project-machine/provision-outputs.ts --project "$PROJECT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provision-fly-org
          path: ${{ runner.temp }}/provision/provision.json
          if-no-files-found: error
          retention-days: 1

  provision:
    needs: outputs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: fly-org
    # fly-ci-tokens.yml's key: this job cuts and writes the same tokens, and
    # two applies at once would race on every fly-<project> environment.
    concurrency:
      group: fly-org
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: fly on the PATH
        run: |
          if ! command -v fly >/dev/null; then
            mkdir -p "$RUNNER_TEMP/flybin"
            ln -s "$(command -v flyctl)" "$RUNNER_TEMP/flybin/fly"
            echo "$RUNNER_TEMP/flybin" >> "$GITHUB_PATH"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: provision-fly-org
          path: ${{ runner.temp }}/provision
      - name: Make the project's machine
        env:
          CW_SECRETS_FROM_ENV: '1'
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          HANDOFF_PRIVATE_KEY: ${{ secrets.HANDOFF_PRIVATE_KEY }}
          CW_SECRET_FLY_ORG_SLUG: ${{ vars.FLY_ORG_SLUG }}
          # The transcript store (deploy-store.ts): empty until the first run
          # makes the bucket and writes both to this environment.
          CW_SECRET_CW_TRANSCRIPT_STORE_BUCKET_ADMIN: ${{ secrets.STORE_BUCKET_ADMIN }}
          CW_SECRET_CW_TRANSCRIPT_STORE_KEYS: ${{ vars.STORE_KEYS }}
          CW_PROVISION_HANDOFF: ${{ runner.temp }}/provision/provision.json
          CW_HANDOFF_OUT: ${{ runner.temp }}/handoff-mac/handoff.json
          PROJECT: ${{ inputs.project }}
          REFRESH_PUSH_KEYS: ${{ inputs.refresh_push_keys }}
          REFRESH_TUNNEL_TOKEN: ${{ inputs.refresh_tunnel_token }}
        run: |
          mkdir -p "$RUNNER_TEMP/handoff-mac"
          set --
          [ "$REFRESH_PUSH_KEYS" = true ] && set -- "$@" --refresh-push-keys
          [ "$REFRESH_TUNNEL_TOKEN" = true ] && set -- "$@" --refresh-tunnel-token
          bun infra/project-machine/machines.ts deploy --project "$PROJECT" --ref "$GITHUB_SHA" --no-terraform-outputs -- "$@"
      - name: Cut the narrow tokens again, the new app's among them
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CW_TF_WORK_DIR: ${{ runner.temp }}/tf
          CW_HANDOFF_OUT: ${{ runner.temp }}/handoff-mac/tokens.json
        run: bun infra/project-machine/ci-tokens.ts apply
      # Also after a failure: what the deploy made before it stopped is sealed
      # there (deploy.ts flushes in a finally), and only the Mac can open it.
      - name: Hand the Mac what was made
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoff-mac
          path: ${{ runner.temp }}/handoff-mac/
          if-no-files-found: ignore
          retention-days: 8
      # The state and the saved plan hold every token this run cut.
      - name: Remove the Terraform work folder
        if: always()
        run: rm -rf "$RUNNER_TEMP/tf"
