# Fly's narrow tokens, cut from the org token and written where they are used
# (infra/project-machine/ci-tokens.ts, infra/cloudflare/fly-ci/). This is the
# job the keeper's `fly` calls became (docs/process/keeper.md, "Retired").
#
#   schedule   every Monday. A deploy token lasts 90 days and a Mac token 14,
#              so each is cut again long before it ends, with no person.
#   dispatch   the same, on main only; fly-provision.yml runs the same apply
#              after it makes an app.
#
# It runs in the GitHub Environment `fly-org` (deployments from main only, no
# reviewer: a merged pull request is the approval). That environment holds
#   FLY_API_TOKEN        the Fly org token, the only copy
#   GH_ADMIN_TOKEN       a classic token with `repo` scope, for the GitHub
#                        provider that writes each `fly-<project>` environment
#   HANDOFF_PRIVATE_KEY  fly-org's handoff key; not used here
#
# and writes
#   fly-<project>.FLY_DEPLOY_TOKEN   one app, no WireGuard, 90 days (fly.yml)
#   handoff-mac artifact             one token per project app for the Mac's
#                                    own `fly` calls (`fly ssh`, `fly logs`),
#                                    14 days, sealed to the Mac's committed
#                                    key (infra/handoff/). The repository is
#                                    public and so is the artifact; only the
#                                    Mac's private key opens it. The Mac
#                                    takes it with `bun run handoff:pull`.
#
# Terraform's state is the runner's temp folder, so every run starts from none
# and GitHub's upsert writes every secret again. No token is printed: the
# script's lines name apps and environments only.

name: fly-ci-tokens

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

permissions: {}

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: fly-org
    concurrency:
      group: fly-org
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Org secrets are present
        id: secrets
        env:
          HAS_FLY: ${{ secrets.FLY_API_TOKEN != '' }}
          HAS_GH: ${{ secrets.GH_ADMIN_TOKEN != '' }}
        run: |
          if [ "$HAS_FLY" = true ] && [ "$HAS_GH" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tokens cut: the fly-org environment does not hold FLY_API_TOKEN and GH_ADMIN_TOKEN yet."
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.present == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - if: steps.secrets.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secrets.outputs.present == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - if: steps.secrets.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # ci-tokens.ts runs `fly`; the action puts `flyctl` on the PATH.
      - name: fly on the PATH
        if: steps.secrets.outputs.present == 'true'
        run: |
          if ! command -v fly >/dev/null; then
            mkdir -p "$RUNNER_TEMP/flybin"
            ln -s "$(command -v flyctl)" "$RUNNER_TEMP/flybin/fly"
            echo "$RUNNER_TEMP/flybin" >> "$GITHUB_PATH"
          fi
      - name: Cut and write the tokens
        if: steps.secrets.outputs.present == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          CW_TF_WORK_DIR: ${{ runner.temp }}/tf
          CW_HANDOFF_OUT: ${{ runner.temp }}/handoff-mac/tokens.json
        run: |
          mkdir -p "$RUNNER_TEMP/handoff-mac"
          bun infra/project-machine/ci-tokens.ts apply
      - name: Hand the Mac its tokens
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: handoff-mac
          path: ${{ runner.temp }}/handoff-mac/
          if-no-files-found: ignore
          retention-days: 8
