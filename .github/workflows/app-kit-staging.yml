# A timed trial of the app kit: make an app with `bun run new-app` and put
# it on Fly staging with `bun run deploy:staging`, from main, with no step
# for a person (templates/app-kit/README.md, "Staging").
#
#   dispatch  on main only. Any other branch deploys nothing.
#
# The clock starts before new-app, and the deploy step prints, and writes to
# the run's summary, the time from there until https://<app>.fly.dev/health
# answers 200.
#
# Secret, in the `fly-appkit-staging` environment (deployments from main
# only, made by `bun run fly:ci-tokens apply`, infra/cloudflare/fly-ci/):
#   FLY_DEPLOY_TOKEN  a Fly token cut down to the one trial app,
#                     cw-appkit-trial-staging, with no WireGuard and so no
#                     `fly ssh`, valid 90 days. It can reach no other app, so
#                     the app is fixed here rather than an input. The app
#                     was made once (deploy-staging.ts makes an app only
#                     when the token can list the org, which this one cannot).
# It is on the deploy step alone: `bun install`, new-app and the setup
# actions never see it. The repo and its logs are public: nothing here
# prints it.

name: app-kit-staging

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: fly-appkit-staging
    concurrency:
      group: app-kit-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # deploy-staging.ts runs `fly`; the action puts `flyctl` on the PATH.
      - name: fly on the PATH
        run: |
          if ! command -v fly >/dev/null; then
            mkdir -p "$RUNNER_TEMP/flybin"
            ln -s "$(command -v flyctl)" "$RUNNER_TEMP/flybin/fly"
            echo "$RUNNER_TEMP/flybin" >> "$GITHUB_PATH"
          fi
      - name: Start the clock
        run: echo "STARTED_AT=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Make the app
        run: bun run new-app "$RUNNER_TEMP/app"
      - name: Install the app
        working-directory: ${{ runner.temp }}/app
        run: bun install
      - name: Deploy to staging and wait for a 200
        working-directory: ${{ runner.temp }}/app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
          # The one app FLY_DEPLOY_TOKEN reaches (ci-tokens.ts STAGING_APP).
          APP_NAME: cw-appkit-trial-staging
        run: bun run deploy:staging "$APP_NAME" --started-at "$STARTED_AT"
