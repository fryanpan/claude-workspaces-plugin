# Cloudflare's configuration, deployed by Terraform (infra/cloudflare/README.md).
#
#   pull request  fmt, validate and the plan tests; then a plan for prod,
#                 summarised on the PR. Skipped, not failed, when the plan
#                 secrets are absent (a fork's PR, or before they are set).
#   push to main  the same check, then apply to prod in the GitHub Environment
#                 `cloudflare-prod`. A merged pull request is the approval: the
#                 environment has no required reviewer.
#   dispatch      the same as a push, when run on main. The keeper dispatches
#                 it after `bun run cf:sync-config` writes the gitignored
#                 configs' secrets (infra/cloudflare/README.md, "CI"); a
#                 dispatch on any other branch runs the check and applies
#                 nothing.
#
# No Fly token is used here: a project machine's image deploys from fly.yml.
# Machines take new server code from the signed releases server-release.yml
# publishes (docs/process/project-machine.md).
#
# The repo is public, so these logs are too. terraform's own output is not
# printed: a plan is reported as resource addresses and verbs only
# (infra/cloudflare/plan-summary.ts), and addresses carry no hostname.
#
# Secrets, by name (README.md, "CI"). The repository's copies are read-only
# and are what a pull request's plan gets; the `cloudflare-prod`
# environment's copies (deployments from main only) can write, and GitHub
# gives an environment secret precedence over a repository secret of the
# same name in the jobs that use the environment.
#   CLOUDFLARE_API_TOKEN                                       both; required
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY                     both; optional
#   CF_ROUTER_CONFIG, CF_ACCESS_CONFIG, CF_SHARE_LINK_CONFIG   repository
# Without the R2 pair, ci-credentials.ts derives the state bucket's key from
# CLOUDFLARE_API_TOKEN (its id, and the SHA-256 of its value), masks it, and
# hands it to terraform's environment alone. The token then needs R2 write.
# Variable (optional): CF_TFSTATE_BUCKET, default claude-workspaces-tfstate.
#
# This file is outside `bun run verify:parity`, which reads ci.yml only: its
# one gate, check:cloudflare-tf, is also a step of ci.yml's gates job.

name: cloudflare

on:
  pull_request:
    paths:
      - infra/cloudflare/**
      - infra/board-router-worker/worker.js
      - infra/share-link-worker/worker.js
      - .github/workflows/cloudflare.yml
  push:
    branches: [main]
    paths:
      - infra/cloudflare/**
      - infra/board-router-worker/worker.js
      - infra/share-link-worker/worker.js
      - .github/workflows/cloudflare.yml
  workflow_dispatch: {}

permissions: {}

env:
  TF_IN_AUTOMATION: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Formatted, valid, and the plan tests pass
        run: bun run check:cloudflare-tf

  plan:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # ci-credentials.ts hands the S3 backend its key under the AWS names.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CF_ROUTER_CONFIG: ${{ secrets.CF_ROUTER_CONFIG }}
      CF_ACCESS_CONFIG: ${{ secrets.CF_ACCESS_CONFIG }}
      CF_SHARE_LINK_CONFIG: ${{ secrets.CF_SHARE_LINK_CONFIG }}
      CF_TFSTATE_BUCKET: ${{ vars.CF_TFSTATE_BUCKET }}
    steps:
      - name: Plan secrets are present
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CF_ROUTER_CONFIG" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No plan: the plan secrets are not available to this run (a fork's pull request, or not set yet)."
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.present == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - if: steps.secrets.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secrets.outputs.present == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Plan prod
        if: steps.secrets.outputs.present == 'true'
        env:
          CF_PLAN_SUMMARY: ${{ runner.temp }}/plan.md
        run: bun infra/cloudflare/ci-credentials.ts -- bun infra/cloudflare/run.ts plan prod --ci
      - name: Post the plan summary
        if: steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/plan.md"

  apply:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: cloudflare-prod
    concurrency:
      group: cloudflare-prod
      cancel-in-progress: false
    permissions:
      contents: read
    # The write token and the state key are on the one step that needs them,
    # not the job: `bun install` and the setup actions never see them.
    steps:
      # Until the environment's secrets are set, a merge skips the apply
      # rather than failing main. Only whether each is set leaves this step.
      - name: Apply secrets are present
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CONFIG: ${{ secrets.CF_ROUTER_CONFIG != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ] && [ "$HAS_CONFIG" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No apply: the cloudflare-prod secrets are not set yet."
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: steps.secrets.outputs.present == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - if: steps.secrets.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secrets.outputs.present == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Apply prod
        if: steps.secrets.outputs.present == 'true'
        # ci-credentials.ts hands the S3 backend its key under the AWS names:
        # the R2 pair when set, else the one derived from the token.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ROUTER_CONFIG: ${{ secrets.CF_ROUTER_CONFIG }}
          CF_ACCESS_CONFIG: ${{ secrets.CF_ACCESS_CONFIG }}
          CF_SHARE_LINK_CONFIG: ${{ secrets.CF_SHARE_LINK_CONFIG }}
          CF_TFSTATE_BUCKET: ${{ vars.CF_TFSTATE_BUCKET }}
        run: bun infra/cloudflare/ci-credentials.ts -- bun infra/cloudflare/run.ts apply prod --ci
