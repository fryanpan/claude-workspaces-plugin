# Project machines' images, deployed to Fly from main
# (infra/project-machine/README.md, docs/process/project-machine.md).
#
#   push to main  when the image's inputs change: infra/project-machine/**,
#                 the root package.json or bun.lock (a machine refuses a
#                 signed release built against another bun.lock, so a lock
#                 change needs a new image), or this file.
#   dispatch      the same, on main only. Any other branch deploys nothing.
#
# One deploy job per machine in infra/project-machine/machines.json
# (`machines.ts matrix`), each in the GitHub Environment `fly-<project>`. That
# environment admits deployments from main alone and holds one secret,
# FLY_DEPLOY_TOKEN: a Fly token cut down to that project's app, with no
# WireGuard and so no `fly ssh`, valid 90 days. `bun run fly:ci-tokens apply`
# on the Mac makes the environments and the tokens (infra/cloudflare/fly-ci/,
# infra/project-machine/ci-tokens.ts). A job sees its own project's token and
# nothing else: no org token, no Cloudflare token, no state key.
#
# `machine:deploy` takes every credential from the environment
# (CW_SECRETS_FROM_ENV=1, mac-ops.ts) and reads no Terraform output
# (--no-terraform-outputs). A run here only updates a machine: an app,
# volume, bucket, backup key or tunnel token the Mac has not set is refused
# before Fly is touched, so a project's first deploy, its lead's browser
# sign-in and a remade tunnel's token still run on the Mac. Server code is not
# deployed here: machines install the signed releases server-release.yml
# publishes.
#
# Until a project's environment holds its token, its job skips the deploy
# rather than failing.

name: fly

on:
  push:
    branches: [main]
    paths:
      - infra/project-machine/**
      - package.json
      - bun.lock
      - .github/workflows/fly.yml
  workflow_dispatch: {}

permissions: {}

jobs:
  projects:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: One job per project machine
        id: list
        run: bun infra/project-machine/machines.ts matrix >> "$GITHUB_OUTPUT"

  deploy:
    needs: projects
    # An empty matrix is an error to GitHub, not zero jobs.
    if: github.ref == 'refs/heads/main' && needs.projects.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.projects.outputs.matrix) }}
    runs-on: ubuntu-latest
    # 45 successful deploy jobs (15 runs, 44848987285-45619413465) took
    # 0.3-9.6 minutes, median 6.5. Without a bound, a hung deploy holds a
    # runner for GitHub's 360-minute default: on 26 Nov one did, 08:02-14:02Z,
    # and every CI run in that window queued a job behind it.
    timeout-minutes: 30
    environment: fly-${{ matrix.project }}
    concurrency:
      group: fly-${{ matrix.project }}
      cancel-in-progress: false
    permissions:
      contents: read
    # The token is on the one step that needs it, not the job: `bun install`
    # and the setup actions never see it.
    steps:
      - name: Deploy token is present
        id: secrets
        env:
          HAS_FLY: ${{ secrets.FLY_DEPLOY_TOKEN != '' }}
        run: |
          if [ "$HAS_FLY" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deploy: this project's environment holds no FLY_DEPLOY_TOKEN yet (bun run fly:ci-tokens apply)."
          fi
      # The full history: the image records its serial, the commit's position
      # on main (release-publish.ts serialOf).
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: steps.secrets.outputs.present == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - if: steps.secrets.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.secrets.outputs.present == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # mac-ops.ts runs `fly`; the action puts `flyctl` on the PATH.
      - name: fly on the PATH
        if: steps.secrets.outputs.present == 'true'
        run: |
          if ! command -v fly >/dev/null; then
            mkdir -p "$RUNNER_TEMP/flybin"
            ln -s "$(command -v flyctl)" "$RUNNER_TEMP/flybin/fly"
            echo "$RUNNER_TEMP/flybin" >> "$GITHUB_PATH"
          fi
      - name: Deploy the project machine
        if: steps.secrets.outputs.present == 'true'
        env:
          CW_SECRETS_FROM_ENV: '1'
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
          PROJECT: ${{ matrix.project }}
        run: bun infra/project-machine/machines.ts deploy --project "$PROJECT" --ref "$GITHUB_SHA" --no-terraform-outputs
