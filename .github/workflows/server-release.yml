# A signed server release for each commit on main that CI passed.
#
# Project machines pull these themselves (infra/project-machine/release-cli.ts):
# each checks the signature against the public key baked into its image,
# boots the release on trial and rolls back if it does not stay up. So this
# job holds no credential for any machine. What it holds:
#
#   CW_RELEASE_SIGNING_KEY  the Ed25519 private key, in the GitHub Environment
#                           `server-release` (deployments from main only).
#                           Without it the run publishes nothing and says so.
#   github.token            contents: write, for this repository's releases.
#
# Everything is published as assets of one GitHub release, `server-channel`
# (a prerelease, never "latest", so the plugin releases release.yml cuts
# keep that name):
#
#   cw-server-<sha>.tar.gz  the release, the last five kept
#   channel.json            the newest release's signed manifest
#
# The runbook is docs/process/project-machine.md, "Releases".

name: server-release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: server-release
  cancel-in-progress: false

jobs:
  publish:
    # Only a push to main in this repository that CI passed: never a pull
    # request's run, a fork's, or a failed one.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: server-release
    permissions:
      contents: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      CHANNEL: server-channel
    steps:
      - name: The signing key is present
        id: key
        env:
          CW_RELEASE_SIGNING_KEY: ${{ secrets.CW_RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$CW_RELEASE_SIGNING_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release: CW_RELEASE_SIGNING_KEY is not set in the server-release environment."
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SHA }}
          # The serial is the commit's position on main.
          fetch-depth: 0
          persist-credentials: false
      - if: steps.key.outputs.present == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.10
      - name: Install and build, as the image does
        if: steps.key.outputs.present == 'true'
        run: |
          bun install --frozen-lockfile
          bun run packages/widget/scripts/build.ts
          bun run packages/workspaces-app/scripts/build.ts
      - name: Build and sign the release
        if: steps.key.outputs.present == 'true'
        env:
          CW_RELEASE_SIGNING_KEY: ${{ secrets.CW_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          serial=$(git rev-list --count --first-parent HEAD)
          bun infra/project-machine/release-publish.ts build \
            --app . --commit "$SHA" --serial "$serial" --out "$RUNNER_TEMP/release"
      - name: Publish it, unless a newer release is already out
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          if ! gh release view "$CHANNEL" >/dev/null 2>&1; then
            gh release create "$CHANNEL" --target "$SHA" --prerelease --latest=false \
              --title "Server releases" \
              --notes "Signed server releases that project machines install themselves. See docs/process/project-machine.md."
          fi
          ours=$(bun infra/project-machine/release-publish.ts serial "$out/channel.json")
          mkdir -p "$RUNNER_TEMP/published"
          if gh release download "$CHANNEL" --pattern channel.json --dir "$RUNNER_TEMP/published" --clobber 2>/dev/null; then
            theirs=$(bun infra/project-machine/release-publish.ts serial "$RUNNER_TEMP/published/channel.json")
            if [ "$theirs" -ge "$ours" ]; then
              echo "::notice::Serial $theirs is already published; not publishing $ours."
              exit 0
            fi
          fi
          # The tarball first: a machine that reads the new channel.json finds it.
          gh release upload "$CHANNEL" "$out/cw-server-$SHA.tar.gz" --clobber
          gh release upload "$CHANNEL" "$out/channel.json" --clobber
          echo "Published serial $ours ($SHA)."
          # Old tarballs are transient: keep the newest five.
          gh release view "$CHANNEL" --json assets \
            --jq '[.assets[] | select(.name | startswith("cw-server-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].name' |
            while read -r name; do gh release delete-asset "$CHANNEL" "$name" --yes; done
