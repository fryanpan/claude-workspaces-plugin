# The share-link edge Worker's routes (see README.md). Copy this file to
# wrangler.local.toml (gitignored) with the real hostnames: `bun run cf:apply`
# (infra/cloudflare) reads the routes from there and deploys the Worker. The
# secret is set separately, never in this file:
#   npx wrangler secret put SHARE_LINK_KEY -c wrangler.local.toml < ../../data/share-url.key
name = "share-link-gate"
main = "worker.js"
compatibility_date = "2026-08-01"

# Only /share/* goes through the Worker; every other path reaches the tunnel
# directly. <public-hostname> is the hostname the server's share config
# serves today; <successor-hostname> is its planned successor — bound now
# so the rename needs no Cloudflare change.
routes = [
  { pattern = "<public-hostname>/share/*", zone_name = "<zone-name>" },
  { pattern = "<successor-hostname>/share/*", zone_name = "<zone-name>" },
]

# Keep observability OFF for this Worker: request logs would carry full
# signed URLs, and the URL is the credential (README "Hygiene").
[observability]
enabled = false
