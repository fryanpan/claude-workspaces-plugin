# One project machine. The app name is per project: pass it as
# `fly deploy -a <app>`; the value below is a placeholder.
#
# Secrets (`fly secrets set`, never in this file):
#   CLOUDFLARE_TUNNEL_TOKEN       the machine's own tunnel (required)
#   BACKUP_S3_ACCESS_KEY_ID       create-only credential for the project's bucket
#   BACKUP_S3_SECRET_ACCESS_KEY
#   CW_SENTRY_SERVER_DSN          optional
#   CW_ORG_ANTHROPIC_API_KEY      this org's own Anthropic key; without it every
#                                 Claude call is refused (project-profile.ts)
# Per-project settings, also set with `fly secrets set` so no project's values
# are committed: BACKUP_RECIPIENT, BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
# CF_ACCESS_TEAM_DOMAIN, CF_ACCESS_AUD, CW_PROXIED_TRUSTED_HOSTS,
# CW_PROXIED_TRUSTED_EMAILS, CW_OWNER_EMAIL, CW_PUBLIC_BASE_URL, and
# CW_PROJECT_PROFILE (`standard` unless set; `claude-only` turns off
# transcription, ElevenLabs and Gemini).
#
# Claude calls spend CW_ORG_ANTHROPIC_API_KEY and nothing else: never a Mac
# Keychain item, another org's key or a gh login. The server removes any such
# variable from its environment at boot (packages/server/src/project-profile.ts).
#
# The runbook is docs/process/project-machine.md.

app = "cw-project-placeholder"
primary_region = "sjc"

[env]
  CW_DATA_DIR = "/data/cw"
  BACKUP_S3_PREFIX = "snapshots/"
  BACKUP_S3_REGION = "auto"
  BACKUP_INTERVAL_HOURS = "6"

# One volume, holding the data dir and anything else that must survive a
# restart. The root filesystem does not.
[mounts]
  source = "cw_data"
  destination = "/data"

# No [http_service] and no [[services]]: nothing is published, so Fly's proxy
# routes no traffic to this machine. It is reached only through the tunnel it
# dials out to.
#
# Health: the server listens on 127.0.0.1 only, which Fly's checks cannot
# reach (they connect to the machine's private address). The check runs
# inside the machine instead (entrypoint.sh): when the server stops
# answering on loopback, the machine exits and this policy restarts it.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"
