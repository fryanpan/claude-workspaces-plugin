# One project machine. Deploy it with `bun run machine:deploy`, which writes
# the project's app name, region and size into a copy of this file; the
# values below are placeholders.
#
# Secrets (set by deploy.ts with `fly secrets import`, never in this file):
#   CLOUDFLARE_TUNNEL_TOKEN       the machine's own named tunnel, or
#   CW_TUNNEL_MODE=quick          a trycloudflare.com quick tunnel, for a test machine
#   BACKUP_S3_ACCESS_KEY_ID       write-only credential for the project's bucket
#   BACKUP_S3_SECRET_ACCESS_KEY
#   CW_SENTRY_SERVER_DSN          optional
#   CW_ORG_ANTHROPIC_API_KEY      this org's own Anthropic key; without it every
#                                 Claude call is refused (project-profile.ts)
# Per-project settings, also Fly secrets so no project's values are committed.
# deploy.ts sets these (settings.ts names each one's source):
#   BACKUP_RECIPIENT, BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET
#   CW_OWNER_EMAIL                the Keychain's cw-board-owner-email
#   CW_PUBLIC_BASE_URL            https:// and the project's first host in
#                                 infra/access-apps/access.local.json
#   CF_ACCESS_TEAM_DOMAIN         the account's Access organization
#   CF_ACCESS_AUD                 the Access application "board <project>"
#   CF_ACCESS_HOST_AUDS           the project's hosts, each to that audience
#   CW_PROXIED_TRUSTED_HOSTS      the project's hosts
# A person sets these with `fly secrets set` when wanted:
#   CW_PROXIED_TRUSTED_EMAILS     defaults to CW_OWNER_EMAIL
#   CW_PROJECT_PROFILE            `standard` unless set; `claude-only` turns off
#                                 transcription, ElevenLabs and Gemini
#
# Claude calls spend CW_ORG_ANTHROPIC_API_KEY and nothing else: never a Mac
# Keychain item, another org's key or a gh login. The server removes any such
# variable from its environment at boot (packages/server/src/project-profile.ts).
#
# The runbook is docs/process/project-machine.md.

app = "cw-project-placeholder"
primary_region = "sjc"

[env]
  CW_DATA_DIR = "/data/cw"
  # The server listens on loopback only and Access fronts its one host, so
  # the machine's own tools (board move check, restore drill) skip the token.
  CW_LOOPBACK_SKIPS_ACCESS = "1"
  # Claude Code's session transcripts: entrypoint.sh points the cw user's
  # ~/.claude/projects here, so they live on the volume and are backed up.
  BACKUP_TRANSCRIPTS_DIR = "/data/claude-projects"
  BACKUP_S3_PREFIX = "snapshots/"
  BACKUP_S3_REGION = "auto"
  BACKUP_INTERVAL_HOURS = "6"

# One volume, holding the data dir and anything else that must survive a
# restart. The root filesystem does not.
[mounts]
  source = "cw_data"
  destination = "/data"

# No [http_service] and no [[services]]: nothing is published, so Fly's proxy
# routes no traffic to this machine. It is reached only through the tunnel it
# dials out to.
#
# Health: the server listens on 127.0.0.1 only, which Fly's checks cannot
# reach (they connect to the machine's private address). The check runs
# inside the machine instead (entrypoint.sh): when the server stops
# answering on loopback, the machine exits and this policy restarts it.
[[restart]]
  policy = "always"

# deploy.ts rewrites everything from here down with the project's size
# (`--memory`, 512 MB unless told otherwise), because `fly deploy` lets this
# block win over its --vm-* flags. Keep [[vm]] the last block in the file.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
