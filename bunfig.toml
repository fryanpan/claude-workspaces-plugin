# Read by `bun test` from the repo root (the documented gate invocation).
# The preloads bind test servers to 127.0.0.1, scale the doc cadences, and
# make descriptor exhaustion name itself; packages/server/test/suite.preload.ts
# lists them.
[test]
# One entry point, also named by packages/server/bunfig.toml and
# packages/server/test/bunfig.toml, so a run started in either directory
# loads the same preloads. The list and its order are in the file.
preload = ["./packages/server/test/suite.preload.ts"]
